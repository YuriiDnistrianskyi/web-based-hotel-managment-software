{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hotel{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <h1>Hotel</h1>
      <p>In the rigth place</p>
    </div>

    <ul class="nav">
      <li>
        <a 
        href="/home"
           class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
          Home
        </a>
      </li>
      <li>
        <a href="/history"
           class="{% if request.resolver_match.url_name == 'history' %}active{% endif %}">
          History
        </a>
      </li>
      <li>
        <a href="/account"
           class="{% if request.resolver_match.url_name == 'account' %}active{% endif %}">
          Account
        </a>
      </li>
    </ul>

    <div class="user">
      <div class="name">{{ user.first_name }} {{user.last_name }}</div>
      <div class="email">{{ user.email }}</div>
    </div>
  </aside>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
