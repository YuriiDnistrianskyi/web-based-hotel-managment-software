{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel — Вхід</title>
  <link rel="stylesheet" href="{% static 'user/css/registration.css' %}">
  <link rel="stylesheet" href="{% static 'user/css/login.css' %}">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card login-card">

      <div class="brand">
        <h1>Hotel</h1>
        <p>У цікавому місті</p>
      </div>

      <h2>Вхід</h2>

      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        {% if form.non_field_errors %}
          <div class="form-errors">{{ form.non_field_errors }}</div>
        {% endif %}

        <div class="field {% if form.email.errors %}has-error{% endif %}">
          <label for="{{ form.email.id_for_label }}">Електронна пошта</label>
          {{ form.email }}
          {{ form.email.errors }}
        </div>

        <div class="field {% if form.password.errors %}has-error{% endif %}">
          <label for="{{ form.password.id_for_label }}">Пароль</label>
          {{ form.password }}
          {{ form.password.errors }}
        </div>

        <button class="btn" type="submit">Увійти</button>
      </form>

      <p class="auth-footer">
        Ще немає акаунту? <a href="{% url 'register' %}">Зареєструватися</a>
      </p>

    </div>
  </main>

</body>
</html>
